# ── Rate limiting zones ─────────────────────────────────────────────────────
# Defined here (outside `server{}`) because this file gets included inside
# the base image's `http{}` block via /etc/nginx/nginx.conf's
# `include /etc/nginx/conf.d/*.conf;` — limit_req_zone is only valid at the
# http level, so it can't live inside the server block below.
#
# Key: $binary_remote_addr — the client IP in compact binary form (cheaper
# to store per-entry than the text form), so each unique IP gets its own
# bucket.
#
# LOGIN — rate=5r/m (5 requests/minute per IP), burst=3 nodelay
#   Legit users log in rarely. 5/min covers someone mistyping their password
#   a couple of times without friction, while making brute-force credential
#   stuffing impractical (an attacker gets ~5 guesses/min/IP, not thousands).
#   `nodelay` lets the burst through immediately instead of queuing/delaying
#   requests, which matters for a login form — a stalled request just looks
#   like the site is broken.
#
# BID — rate=20r/s (20 requests/second per IP), burst=10 nodelay
#   Bidding is the core feature and legitimate concurrent bidding traffic
#   must not be throttled. 20r/s per IP is generous for a single browser
#   tab (a human cannot click "bid" 20x/sec), but still blocks scripted
#   flooding from one source. Since the key is per-IP, two different real
#   bidders on the same auction from different machines are never affected
#   by each other's rate limit — this only protects against a single
#   client hammering the endpoint.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=bid_zone:10m rate=20r/s;

# Return a clear, standard "too many requests" status instead of the nginx
# default (503), so the frontend's getErrorMessage() can recognize it.
limit_req_status 429;

server {
    listen 80;

    # Frontend routes
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Rate-limited: login ──────────────────────────────────────────────────
    # Matches the exact path the frontend sends: baseURL '/api/auth' +
    # login('/auth/login') = '/api/auth/auth/login'. This is a fixed string
    # (no variable in it), so an EXACT-MATCH location (`=`) is used instead
    # of a regex — exact-match locations are allowed to have a URI in
    # proxy_pass, and they take top priority over every other location type,
    # so this still fires before the generic /api/auth/ prefix block below.
    location = /api/auth/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://auth-service:8081/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate-limited: bid submission ────────────────────────────────────────
    # This path has a variable {id} in it, so it does need a regex location —
    # and a regex location is NOT allowed to have a URI part in proxy_pass
    # (that's what crashed nginx before). The fix: `rewrite ... break;`
    # transforms the internal request URI first, then proxy_pass is called
    # with NO path at all — just the upstream host — which is always legal
    # and forwards whatever URI rewrite left behind.
    location ~ ^/api/auctions/auctions/([0-9]+)/bid$ {
        limit_req zone=bid_zone burst=10 nodelay;
        rewrite ^/api/auctions/auctions/([0-9]+)/bid$ /auctions/$1/bid break;
        proxy_pass http://auction-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Service API (everything else under /api/auth/)
    location /api/auth/ {
        proxy_pass http://auth-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wallet Service API
    location /api/wallet/ {
        proxy_pass http://wallet-service:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auction Service API (everything else under /api/auctions/)
    location /api/auctions/ {
        proxy_pass http://auction-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auction Service WebSockets
    location /ws {
        proxy_pass http://auction-service:8082/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}