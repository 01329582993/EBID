services:
  db:
    image: postgres:15-alpine
    container_name: ebid-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ebid-db-data:/var/lib/postgresql/data
      - ./db-init/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: ebid-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=mySuperSecretKeyForEBIDProjectMustBe32CharsLongAtLeast
    depends_on:
      db:
        condition: service_healthy

  wallet-service:
    build: ./wallet-service
    container_name: ebid-wallet-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/wallet_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy

  auction-service:
    build: ./auction-service
    container_name: ebid-auction-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/auction_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - WALLET_SERVICE_URL=http://wallet-service:8083
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      db:
        condition: service_healthy
      wallet-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: ebid-frontend
    ports:
      - "5173:80"

  gateway:
    image: nginx:alpine
    container_name: ebid-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - wallet-service
      - auction-service
      - frontend

volumes:
  ebid-db-data:
